<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d2c"><title>DK Seed Bank | Collection</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193428;background:#f5f4ec}*{box-sizing:border-box}body{margin:0}header{background:#173d2c;color:#fff;padding:3rem max(1rem,calc((100vw - 1100px)/2)) 2.5rem}h1{font-size:clamp(2rem,5vw,3.5rem);margin:.3rem 0}header p{color:#d4e6d5}main{max-width:1100px;margin:auto;padding:2rem 1rem}input{font:inherit;width:100%;padding:1rem;border:1px solid #aab9aa;border-radius:.7rem;background:white}#stats{margin:1rem 0 2rem;font-weight:650}.category{margin:2rem 0}.category h2{border-bottom:2px solid #b5c7b5;padding-bottom:.6rem}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.7rem}.seed{background:white;border:1px solid #dce5d9;border-radius:.65rem;padding:1rem;display:flex;justify-content:space-between;gap:1rem}.seed small{color:#536b5a}.count{flex-shrink:0;font-weight:750;color:#235d3d}.notice{padding:1rem;background:#fff3d9;border-radius:.6rem}footer{max-width:1100px;margin:2rem auto;padding:1rem;color:#56685b}a{color:inherit}</style></head>
<body><header><p>DK Seed Bank</p><h1>Seed Collection</h1><p>Living inventory of seeds, grains, herbs, flowers and more.</p></header><main><label for="search">Search the collection</label><input id="search" type="search" placeholder="Search varieties and categories…" autocomplete="off"><div id="stats" aria-live="polite">Loading inventory…</div><div id="collection"></div></main><footer>Recorded November 11, 2026 · <a href="inventory/seed-collection-2026-11-11.md">View source inventory</a></footer>
<script>
const source='inventory/seed-collection-2026-11-11.md',root=document.getElementById('collection'),stats=document.getElementById('stats'),search=document.getElementById('search');let groups=[];
function parse(md){let category='',items=[];for(const line of md.split(/\r?\n/)){let heading=line.match(/^#{2,3}\s+(.+)$/);if(heading){category=heading[1].trim();continue}let item=line.match(/^-\s+(.+)$/);if(item&&category&&!/inventory notes/i.test(category)){let raw=item[1].trim(),m=raw.match(/^(.*?):\s*(\d+)\b(.*)$/);items.push({category,name:m?m[1]:raw,quantity:m?Number(m[2]):null,detail:m?m[3].trim():''})}}return [...new Set(items.map(x=>x.category))].map(name=>({name,items:items.filter(x=>x.category===name)}))}
function render(){const q=search.value.trim().toLowerCase();root.replaceChildren();let rows=0,packets=0;for(const group of groups){const filtered=group.items.filter(x=>(x.name+' '+x.detail+' '+group.name).toLowerCase().includes(q));if(!filtered.length)continue;const section=document.createElement('section');section.className='category';const title=document.createElement('h2');title.textContent=group.name;section.append(title);const grid=document.createElement('div');grid.className='entries';for(const x of filtered){rows++;if(x.quantity!==null)packets+=x.quantity;const card=document.createElement('div');card.className='seed';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=x.name;info.append(name);if(x.detail){const small=document.createElement('small');small.textContent=' · '+x.detail;info.append(small)}card.append(info);if(x.quantity!==null){const count=document.createElement('span');count.className='count';count.textContent='×'+x.quantity;count.setAttribute('aria-label','Quantity '+x.quantity);card.append(count)}grid.append(card)}section.append(grid);root.append(section)}stats.textContent=rows+' seed entries across '+root.children.length+' categories · '+packets+' recorded units (including some loose lots)';if(!rows)root.textContent='No matching seeds found.'}
fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(md=>{groups=parse(md);render()}).catch(e=>{stats.textContent='Inventory could not be loaded.';root.className='notice';root.textContent='The inventory file is unavailable. Check the repository source path. ('+e.message+')'});search.addEventListener('input',render);
</script></body></html>
